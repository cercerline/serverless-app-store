<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<title>密码生成器 · 本地生成不外传</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  :root{--bg:#0b1220;--card:#141d2f;--line:rgba(255,255,255,.09);--text:#e8eefc;--dim:#8b9ab5;--accent:#22d3ee;
        --weak:#fb7185;--mid:#fbbf24;--strong:#34d399}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);color:var(--text);min-height:100vh;
    font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    padding:20px 16px calc(24px + env(safe-area-inset-bottom));display:flex;justify-content:center;
  }
  .wrap{width:100%;max-width:520px}
  h1{font-size:20px;margin:0 0 4px;font-weight:600}
  .sub{color:var(--dim);font-size:13px;margin:0 0 18px}
  .out{
    background:linear-gradient(135deg,#13203a,#0e1a30);border:1px solid var(--line);
    border-radius:18px;padding:20px;margin-bottom:12px;
  }
  .pwd{
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-size:clamp(17px,4.6vw,23px);font-weight:600;letter-spacing:.5px;
    word-break:break-all;line-height:1.5;min-height:1.5em;color:var(--text);
  }
  .meter{display:flex;gap:5px;margin-top:16px}
  .meter i{flex:1;height:5px;border-radius:99px;background:rgba(255,255,255,.09);transition:background .25s}
  .meta{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:12px;color:var(--dim)}
  .meta b{font-weight:600}
  .acts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
  .acts button{
    border:0;border-radius:13px;padding:15px;font-size:16px;font-weight:600;font-family:inherit;
    cursor:pointer;transition:filter .15s;
  }
  .acts button:hover{filter:brightness(1.08)}
  #copy{background:var(--accent);color:#06202a}
  #regen{background:transparent;color:var(--text);border:1px solid var(--line);font-weight:400}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
  label{display:block;font-size:13px;color:var(--dim);margin-bottom:8px}
  .lenrow{display:flex;align-items:center;gap:14px;margin-bottom:6px}
  input[type=range]{flex:1;accent-color:var(--accent);height:5px}
  .lenval{
    font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;min-width:52px;text-align:right;color:var(--accent);
  }
  .opts{display:flex;flex-direction:column;gap:2px;margin-top:14px;border-top:1px solid var(--line);padding-top:14px}
  .opt{display:flex;align-items:center;gap:11px;padding:9px 0;cursor:pointer}
  .opt input{width:18px;height:18px;accent-color:var(--accent);flex:0 0 auto}
  .opt .n{flex:1;font-size:15px}
  .opt .ex{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--dim);max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .warn{background:rgba(251,113,133,.08);border:1px solid rgba(251,113,133,.25);border-radius:12px;padding:12px;font-size:13px;color:#fda4af;line-height:1.6;margin-top:12px}
  .note{background:rgba(34,211,238,.07);border:1px solid rgba(34,211,238,.2);border-radius:12px;padding:12px;font-size:13px;color:#a5f3fc;line-height:1.6;margin-top:12px}
  .foot{font-size:12px;color:#4a5568;text-align:center;margin-top:20px;line-height:1.7}
  .toast{
    position:fixed;left:50%;bottom:32px;transform:translateX(-50%) translateY(80px);
    background:#22d3ee;color:#06202a;padding:12px 24px;border-radius:99px;font-size:14px;font-weight:600;
    transition:transform .3s;z-index:9;pointer-events:none;
  }
  .toast.show{transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="wrap">
  <h1>密码生成器</h1>
  <p class="sub">在本机生成，不联网、不上传、不留痕</p>

  <div class="out">
    <div class="pwd" id="pwd">点击下方「重新生成」</div>
    <div class="meter" id="meter"><i></i><i></i><i></i><i></i></div>
    <div class="meta">
      <span>强度：<b id="strength">—</b></span>
      <span id="bits">—</span>
    </div>
  </div>

  <div class="acts">
    <button id="copy">复制</button>
    <button id="regen">重新生成</button>
  </div>

  <div class="card">
    <label>密码长度 <span id="lenHint" style="color:var(--accent);font-weight:600">16</span> 位</label>
    <div class="lenrow">
      <input type="range" id="len" min="6" max="64" value="16">
    </div>

    <div class="opts">
      <label class="opt"><input type="checkbox" id="lower" checked><span class="n">小写字母</span><span class="ex">abcdefg</span></label>
      <label class="opt"><input type="checkbox" id="upper" checked><span class="n">大写字母</span><span class="ex">ABCDEFG</span></label>
      <label class="opt"><input type="checkbox" id="digit" checked><span class="n">数字</span><span class="ex">1234567</span></label>
      <label class="opt"><input type="checkbox" id="symbol" checked><span class="n">符号</span><span class="ex">!@#$%^&amp;*</span></label>
      <label class="opt"><input type="checkbox" id="nosimilar"><span class="n">排除易混字符</span><span class="ex">0O1lI</span></label>
    </div>

    <div class="warn" id="warn" style="display:none">至少要勾选一种字符类型</div>
    <div class="note">
      密码由浏览器内置的加密随机数生成器产生（<code>crypto.getRandomValues</code>），
      关掉网页就没了，我不会保存，也无法保存。
    </div>
  </div>

  <p class="foot">离线可用 · 无网络请求</p>
</div>
<div class="toast" id="toast">已复制</div>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };

  var SETS = {
    lower: 'abcdefghijklmnopqrstuvwxyz',
    upper: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ',
    digit: '0123456789',
    symbol: '!@#$%^&*()-_=+[]{};:,.?/'
  };
  var SIMILAR = /[0O1lI|`'"]/g;

  function activeSets() {
    var out = [];
    ['lower', 'upper', 'digit', 'symbol'].forEach(function (k) {
      if ($(k).checked) out.push(SETS[k]);
    });
    if ($('nosimilar').checked) {
      out = out.map(function (s) { return s.replace(SIMILAR, ''); });
    }
    return out.filter(function (s) { return s.length > 0; });
  }

  // Rejection sampling keeps the distribution uniform; taking `random % n` would
  // bias the first characters of each alphabet.
  function pick(alphabet) {
    var limit = Math.floor(4294967296 / alphabet.length) * alphabet.length;
    var buf = new Uint32Array(1);
    for (;;) {
      crypto.getRandomValues(buf);
      if (buf[0] < limit) return alphabet[buf[0] % alphabet.length];
    }
  }

  function generate() {
    var sets = activeSets();
    if (!sets.length) {
      $('warn').style.display = '';
      $('pwd').textContent = '—';
      $('strength').textContent = '—';
      $('bits').textContent = '—';
      paintMeter(0);
      return;
    }
    $('warn').style.display = 'none';

    var len = +$('len').value;
    var all = sets.join('');
    var chars = [];

    // Guarantee at least one character from every selected set, then fill the
    // rest from the pooled alphabet and shuffle so the guaranteed ones are not
    // always at the front.
    sets.forEach(function (s) { chars.push(pick(s)); });
    while (chars.length < len) chars.push(pick(all));
    chars = chars.slice(0, len);

    for (var i = chars.length - 1; i > 0; i--) {
      var buf = new Uint32Array(1);
      crypto.getRandomValues(buf);
      var j = buf[0] % (i + 1);
      var tmp = chars[i]; chars[i] = chars[j]; chars[j] = tmp;
    }

    var pwd = chars.join('');
    $('pwd').textContent = pwd;

    var bits = Math.round(len * Math.log2(all.length));
    $('bits').textContent = '约 ' + bits + ' 位熵';
    var label = bits < 50 ? ['弱', 1, 'var(--weak)']
              : bits < 75 ? ['中等', 2, 'var(--mid)']
              : bits < 110 ? ['强', 3, 'var(--strong)']
              : ['非常强', 4, 'var(--strong)'];
    $('strength').textContent = label[0];
    $('strength').style.color = label[2];
    paintMeter(label[1], label[2]);
  }

  function paintMeter(level, color) {
    var bars = $('meter').children;
    for (var i = 0; i < bars.length; i++) {
      bars[i].style.background = i < level ? (color || 'var(--accent)') : 'rgba(255,255,255,.09)';
    }
  }

  $('regen').onclick = generate;

  $('copy').onclick = function () {
    var text = $('pwd').textContent;
    if (!text || text === '—' || text.indexOf('点击') === 0) return;

    function done() {
      var t = $('toast');
      t.classList.add('show');
      setTimeout(function () { t.classList.remove('show'); }, 1600);
    }

    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(done, fallback);
    } else {
      fallback();
    }

    // Older in-app browsers (WeChat, some Android WebViews) do not expose the
    // async clipboard API, so fall back to a hidden selection + execCommand.
    function fallback() {
      try {
        var ta = document.createElement('textarea');
        ta.value = text;
        ta.setAttribute('readonly', '');
        ta.style.position = 'fixed';
        ta.style.left = '-9999px';
        document.body.appendChild(ta);
        ta.select();
        ta.setSelectionRange(0, text.length);
        document.execCommand('copy');
        document.body.removeChild(ta);
        done();
      } catch (e) {
        alert('复制失败，请长按密码手动复制');
      }
    }
  };

  $('len').oninput = function () {
    $('lenHint').textContent = this.value;
    generate();
  };
  ['lower', 'upper', 'digit', 'symbol', 'nosimilar'].forEach(function (id) {
    $(id).onchange = generate;
  });

  generate();
})();
</script>
</body>
</html>
